name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  proxy:
    name: proxy-${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build proxy and protocol tests
        shell: pwsh
        run: |
          $devcmd = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat'
          cmd.exe /d /c "call `"$devcmd`" -arch=${{ matrix.arch }} >nul && cmake -S . -B build\${{ matrix.arch }} -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build\${{ matrix.arch }} --target dinput8 ffb_protocol_tests ffb_wrapper_tests ffb_dinput_wrapper_tests ffb_performance_tests && ctest --test-dir build\${{ matrix.arch }} --output-on-failure"
          exit $LASTEXITCODE

  viewer:
    name: viewer-py${{ matrix.python }}
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Test and lint
        working-directory: viewer
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run ty check src
          uv run pytest -s --cov=ffb_visualizer --cov-report=term-missing
