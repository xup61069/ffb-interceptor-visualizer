name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  proxy:
    name: proxy-${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build proxy and protocol tests
        shell: cmd
        run: >-
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
          -arch=${{ matrix.arch }} && cmake -S . -B build\${{ matrix.arch }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release && cmake --build build\${{ matrix.arch }}
          --target dinput8 ffb_protocol_tests && ctest --test-dir build\${{ matrix.arch }} --output-on-failure

  viewer:
    name: viewer-py${{ matrix.python }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Test and lint
        working-directory: viewer
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run ty check src
          uv run pytest --cov=ffb_visualizer --cov-report=term-missing
