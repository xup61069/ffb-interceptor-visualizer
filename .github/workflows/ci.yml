name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  proxy:
    name: proxy-${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    env:
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build proxy, launcher, manager, hook, and tests
        shell: pwsh
        run: |
          $devcmd = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat'
          cmd.exe /d /c "call `"$devcmd`" -arch=$env:BUILD_ARCH >nul && cmake -S . -B build\$env:BUILD_ARCH -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build\$env:BUILD_ARCH --target dinput8 ffb_hook ffb_launcher ffb_manager ffb_e2e_probe ffb_protocol_tests ffb_wrapper_tests ffb_dinput_wrapper_tests ffb_performance_tests ffb_telemetry_tests ffb_iat_hook_tests ffb_manager_tests && ctest --test-dir build\$env:BUILD_ARCH --output-on-failure"
          exit $LASTEXITCODE
      - name: Test launcher-to-SimHub pipeline without a game DLL
        shell: pwsh
        run: |
          dotnet build tests\e2e\FFBInterceptor.E2E.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests\e2e\bin\Release\net48\FFBInterceptor.E2E.Tests.exe `
            "build\$env:BUILD_ARCH\FFBInterceptor.Launcher.exe" `
            "build\$env:BUILD_ARCH\e2e\FFBInterceptor.E2E.Probe.exe"
          exit $LASTEXITCODE
      - name: Reject app-local runtime dependency loading
        shell: pwsh
        run: |
          tests\powershell\binary_hardening_tests.ps1 -BinaryPaths @(
            "build\$env:BUILD_ARCH\dinput8.dll",
            "build\$env:BUILD_ARCH\FFBInterceptor.Hook.dll",
            "build\$env:BUILD_ARCH\FFBInterceptor.Launcher.exe",
            "build\$env:BUILD_ARCH\FFBInterceptor.Manager.exe"
          )
      - name: Build and test fail-closed stable Manager policy
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $devcmd = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat'
          $signer = '0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF'
          cmd.exe /d /c "call `"$devcmd`" -arch=x64 >nul && cmake -S . -B build\stable-manager -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFB_STABLE_PACKAGE=ON -DFFB_EXPECTED_SIGNER_SHA256=$signer && cmake --build build\stable-manager --target ffb_manager ffb_manager_tests && ctest --test-dir build\stable-manager -R ffb_manager_tests --output-on-failure"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $validatedSigner = & simhub\tools\Test-ManagerBuildPolicy.ps1 `
            -ManagerPath build\stable-manager\FFBInterceptor.Manager.exe
          if ($validatedSigner -cne $signer) {
            throw "Stable Manager signer mismatch: $validatedSigner"
          }
          & tests\powershell\manager_policy_tests.ps1 `
            -StableManagerPath build\stable-manager\FFBInterceptor.Manager.exe `
            -ExperimentalManagerPath build\x64\FFBInterceptor.Manager.exe `
            -ExpectedSigner $signer

  simhub-core:
    name: simhub-core-net48
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build and test clipping core
        shell: pwsh
        run: |
          dotnet build simhub\FFBInterceptor.Core.Tests\FFBInterceptor.Core.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & simhub\FFBInterceptor.Core.Tests\bin\Release\net48\FFBInterceptor.Core.Tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate and package Dash Studio assets
        shell: pwsh
        run: |
          & simhub\tools\Test-Dashboards.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & simhub\tools\Build-Dashboards.ps1 -OutputDirectory "$env:RUNNER_TEMP\ffb-dashboards"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem "$env:RUNNER_TEMP\ffb-dashboards" -Filter '*.simhubdash')
          if ($packages.Count -ne 2) { throw 'Dashboard packaging did not produce exactly two archives.' }
      - name: Parse portable installer scripts
        shell: pwsh
        run: |
          $scripts = @(
            'simhub\portable\Install-FFBInterceptor.ps1',
            'simhub\portable\Uninstall-FFBInterceptor.ps1',
            'simhub\tools\Build-ReadyToUsePackage.ps1',
            'simhub\tools\Test-ReadyToUsePackage.ps1',
            'simhub\launcher-portable\FFBInterceptor.Common.ps1',
            'simhub\launcher-portable\Install-SimHubPlugin.ps1',
            'simhub\launcher-portable\Uninstall-SimHubPlugin.ps1',
            'simhub\launcher-portable\Start-FFBInterceptor.ps1',
            'simhub\tools\Build-LauncherPackage.ps1',
            'simhub\tools\ArchiveHelpers.ps1',
            'simhub\tools\Test-LauncherPackage.ps1',
            'simhub\tools\Build-SimHubPackage.ps1',
            'simhub\tools\Test-SimHubPackage.ps1',
            'simhub\tools\Test-SimHubSdk.ps1',
            'simhub\tools\Test-ManagerBuildPolicy.ps1',
            'tests\powershell\binary_hardening_tests.ps1',
            'tests\powershell\manager_elevation_tests.ps1',
            'tests\powershell\manager_policy_tests.ps1',
            'tests\powershell\release_preflight_tests.ps1',
            '.github\scripts\package-release.ps1',
            '.github\scripts\import-signing-certificate.ps1',
            '.github\scripts\assert-release-assets-empty.ps1',
            '.github\scripts\publish-release-assets.ps1'
          )
          foreach ($scriptPath in $scripts) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $scriptPath), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax error in $scriptPath : $($errors[0].Message)" }
          }
          & tests\powershell\manager_elevation_tests.ps1 -RepositoryRoot .
      - name: Test release gates with offline fixtures
        shell: pwsh
        run: |
          tests\powershell\release_gate_tests.ps1
          tests\powershell\release_preflight_tests.ps1
          tests\powershell\simhub_sdk_tests.ps1
          tests\powershell\package_archive_tests.ps1

  coverage:
    name: coverage-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build instrumentable native and managed tests
        shell: pwsh
        run: |
          $devcmd = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat'
          cmd.exe /d /c "call `"$devcmd`" -arch=x64 >nul && cmake -S . -B build\coverage -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build\coverage --target all"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build simhub\FFBInterceptor.Core.Tests\FFBInterceptor.Core.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests\e2e\FFBInterceptor.E2E.Tests.csproj -c Release
          exit $LASTEXITCODE
      - name: Enforce native line coverage
        shell: pwsh
        run: |
          $build = (Resolve-Path -LiteralPath 'build\coverage').Path
          $suite = (Resolve-Path -LiteralPath 'tests\powershell\run-native-coverage-suite.ps1').Path
          $e2e = (Resolve-Path -LiteralPath 'tests\e2e\bin\Release\net48\FFBInterceptor.E2E.Tests.exe').Path
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $suite, '-BuildDirectory', $build, '-E2ETest', $e2e)
          $include = @(
            "$build\ffb_*tests.exe",
            "$build\FFBInterceptor.Launcher.exe",
            "$build\FFBInterceptor.Hook.dll",
            "$build\e2e\FFBInterceptor.E2E.Probe.exe"
          )
          .github\scripts\invoke-code-coverage.ps1 `
            -CommandPath (Get-Command powershell.exe).Source `
            -CommandArguments $arguments -IncludeFiles $include `
            -Output 'build\coverage\native.cobertura.xml'
          .github\scripts\assert-cobertura-coverage.ps1 `
            -Report 'build\coverage\native.cobertura.xml' `
            -PathContains @('/src/', '/launcher/') -RequireEachPath `
            -MinimumPercent 50 -MinimumTrackedLines 900
      - name: Enforce SimHub core line coverage
        shell: pwsh
        run: |
          $test = (Resolve-Path -LiteralPath 'simhub\FFBInterceptor.Core.Tests\bin\Release\net48\FFBInterceptor.Core.Tests.exe').Path
          $core = (Resolve-Path -LiteralPath 'simhub\FFBInterceptor.Core.Tests\bin\Release\net48\FFBInterceptor.Core.dll').Path
          .github\scripts\invoke-code-coverage.ps1 -CommandPath $test `
            -IncludeFiles @($core) -Output 'build\coverage\managed.cobertura.xml'
          .github\scripts\assert-cobertura-coverage.ps1 `
            -Report 'build\coverage\managed.cobertura.xml' `
            -PathContains '/simhub/FFBInterceptor.Core/' `
            -MinimumPercent 75 -MinimumTrackedLines 500

  viewer:
    name: viewer-py${{ matrix.python }}
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.5'
          enable-cache: false
      - name: Test and lint
        working-directory: viewer
        run: |
          uv sync --locked --extra dev
          uv run ruff check .
          uv run ty check src
          uv run pytest -s --cov=ffb_visualizer --cov-report=term-missing --cov-fail-under=85
          uv run python -m unittest discover -s ..\tests\python -v
