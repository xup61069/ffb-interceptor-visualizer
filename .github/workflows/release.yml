name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and versions
        shell: pwsh
        run: .github/scripts/verify-release-ref.ps1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Build and package
        shell: pwsh
        run: .github/scripts/package-release.ps1
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*
      - name: Create unsigned experimental release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | ForEach-Object FullName)
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" $assets --clobber --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit "$env:RELEASE_TAG" --title "$env:RELEASE_TAG — UNSIGNED EXPERIMENTAL" --prerelease --notes "UNSIGNED EXPERIMENTAL — command telemetry only; not motor torque." --repo "$env:GITHUB_REPOSITORY"
            exit $LASTEXITCODE
          }
          gh release create "$env:RELEASE_TAG" $assets --title "$env:RELEASE_TAG — UNSIGNED EXPERIMENTAL" --prerelease --notes "UNSIGNED EXPERIMENTAL — command telemetry only; not motor torque." --repo "$env:GITHUB_REPOSITORY"
