name: Experimental base release

on:
  repository_dispatch:
    types: [ffb-experimental-base-release]

concurrency:
  group: release-${{ github.event.client_payload.tag }}
  cancel-in-progress: false

permissions: {}

env:
  RELEASE_TAG: ${{ github.event.client_payload.tag }}

jobs:
  build:
    name: package-attest-and-publish
    if: ${{ github.event_name == 'repository_dispatch' && github.ref == 'refs/heads/master' }}
    permissions:
      actions: read # inspect checks tied to the exact release commit
      checks: read # inspect checks tied to the exact release commit
      contents: write # create the requested release and add immutable assets
      id-token: write # mint the OIDC identity for provenance
      attestations: write # publish provenance for each asset
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false
      - name: Validate repository dispatch payload
        shell: pwsh
        env:
          FFB_CLIENT_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          $payload = $env:FFB_CLIENT_PAYLOAD_JSON | ConvertFrom-Json -ErrorAction Stop
          $names = @($payload.PSObject.Properties | ForEach-Object Name)
          if ($names.Count -ne 1 -or $names[0] -cne 'tag') {
            throw 'Base release client_payload must contain exactly: tag.'
          }
          $tag = [string]$payload.tag
          if ($tag -cne $env:RELEASE_TAG -or
              $tag -notmatch '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\z') {
            throw 'Base release client_payload.tag must be a canonical vX.Y.Z tag.'
          }
      - name: Bind release tag to trusted master HEAD
        id: bind-release
        shell: pwsh
        run: |
          $commit = .github/scripts/verify-release-ref.ps1 `
            -RefreshRemote -RequireMasterHead -PassThru
          if ($commit -notmatch '^[0-9a-f]{40}$') { throw 'Release binding returned an invalid commit SHA.' }
          "commit_sha=$commit" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "FFB_RELEASE_COMMIT=$commit" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.bind-release.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reverify bound release source
        shell: pwsh
        run: |
          .github/scripts/verify-release-ref.ps1 -RefreshRemote `
            -ExpectedCommitSha $env:FFB_RELEASE_COMMIT
      - name: Require successful checks for the exact tagged commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/wait-required-checks.ps1 `
            -Repository $env:GITHUB_REPOSITORY `
            -CommitSha (git rev-parse HEAD).Trim()
      - name: Scan complete history before publishing
        shell: pwsh
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitleaks = Join-Path (go env GOPATH) 'bin/gitleaks.exe'
          & $gitleaks git --redact --log-opts="--all"
          exit $LASTEXITCODE
      - name: Audit SPDX headers before publishing
        shell: pwsh
        run: .github/scripts/check-license-headers.ps1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.5'
          enable-cache: false
      - name: Build unsigned experimental assets
        shell: pwsh
        run: .github/scripts/package-release.ps1
      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release/*
      - name: Publish verified experimental release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/verify-release-ref.ps1 -RefreshRemote `
            -ExpectedCommitSha $env:FFB_RELEASE_COMMIT
          .github/scripts/publish-release-assets.ps1 `
            -AssetsDirectory release `
            -Tag $env:RELEASE_TAG `
            -Repository $env:GITHUB_REPOSITORY `
            -Title "$env:RELEASE_TAG — 未簽章實驗版" `
            -NotesPath '.github/release-notes.md' `
            -ChannelNotice 'UNSIGNED EXPERIMENTAL — 未簽章實驗版；只代表指令遙測，不是馬達扭力。' `
            -Prerelease
