name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and package
        shell: pwsh
        run: .github/scripts/package-release.ps1
      - name: Create unsigned experimental release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          prerelease: true
          body: "UNSIGNED EXPERIMENTAL — command telemetry only; not motor torque."
          files: release/*
