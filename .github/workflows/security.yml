name: Security analysis

on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [master]
  pull_request:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    name: codeql
    permissions:
      security-events: write # upload CodeQL results for this repository
      actions: read # allow CodeQL to read workflow metadata
      contents: read # checkout the audited source
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: c-cpp, python
      - name: Build C++ for CodeQL
        shell: pwsh
        run: |
          $devcmd = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat'
          cmd.exe /d /c "call `"$devcmd`" -arch=x64 >nul && cmake -S . -B build\codeql -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build\codeql --target dinput8"
          exit $LASTEXITCODE
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  dependency-audit:
    name: dependency-audit
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv pip-audit
      - working-directory: viewer
        run: uv sync --extra dev; uv run pip-audit

  supply-chain:
    name: history-and-workflow-audit
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanners
        shell: pwsh
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python -m pip install --disable-pip-version-check zizmor==1.29.0
      - name: Scan complete Git history for secrets
        run: gitleaks git --redact --log-opts="--all"
      - name: Lint GitHub Actions workflows
        run: actionlint
      - name: Audit workflow supply-chain policy
        run: zizmor --pedantic .github/workflows
      - name: Audit SPDX license headers
        shell: pwsh
        run: .github/scripts/check-license-headers.ps1
